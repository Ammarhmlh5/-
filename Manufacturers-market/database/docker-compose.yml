services:
  marketplace_postgres:
    image: postgres:15-alpine
    container_name: marketplace_db
    environment:
      POSTGRES_USER: ${MARKET_DB_USER:-market_user}
      POSTGRES_PASSWORD: ${MARKET_DB_PASSWORD:-marketpass2026}
      POSTGRES_DB: ${MARKET_DB_NAME:-shipping_marketplace}
    ports:
      - "5543:5432"
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARKET_DB_USER:-market_user} -d ${MARKET_DB_NAME:-shipping_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  marketplace_api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: marketplace_api
    env_file:
      - ../server/.env
    environment:
      DATABASE_URL: postgresql+psycopg://market_user:marketpass2026@marketplace_postgres:5432/shipping_marketplace
      ERPNEXT_URL: http://host.docker.internal:8080
      OP03_GATEWAY_URL: http://host.docker.internal:5000
      OP03_CALLBACK_URL: http://host.docker.internal:8002/api/market/webhooks/op03
      MARKET_ERP_KEY: ${MARKET_ERP_KEY:-}
      HOST: 0.0.0.0
      PORT: 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8000"
    depends_on:
      marketplace_postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  marketplace_postgres_data:
